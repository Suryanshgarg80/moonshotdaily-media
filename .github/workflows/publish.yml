name: publish

# One run posts the whole day's queue (~30 min apart) and commits state after each post.
# Several triggers because GitHub's scheduler can start hours late; extra runs find nothing left to do.
# 14:07 UTC = 7:07 AM PDT / 6:07 AM PST.
on:
  schedule:
    - cron: '7 14 * * *'
    - cron: '7 15 * * *'
    - cron: '37 16 * * *'
    - cron: '7 18 * * *'
    - cron: '7 20 * * *'
      - name: Publish next queued post
        run: node publisher/publish.mjs
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          QUEUE_DATE: ${{ inputs.queue_date || '' }}
      - name: Save publish state
        if: always()
        run: |
          git config user.name "moonshot-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase && git push)
